# Check the committed dependency graph against current RustSec advisories.
[advisories]

# Minimal permissive-license policy; no advisory ignores or license exceptions.
[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# The unpublished local application has no declared license; scan its dependencies.
ignore = true
