# Check the committed dependency graph against current RustSec advisories.
[advisories]

# Common permissive licenses, so ordinary dependency updates do not block merges.
[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[licenses.private]
# The unpublished local application has no declared license; scan its dependencies.
ignore = true
